services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codequest
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://codequest:codequest@db:5432/codequest
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOW_ALL_ORIGINS: "true"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin1234
      DJANGO_SUPERUSER_EMAIL: admin@codequest.app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
