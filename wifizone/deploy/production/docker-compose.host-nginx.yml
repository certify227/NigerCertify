# WiFiZone Pro — Docker + Nginx système (port 8004)
# Lancer avec: ./scripts/compose-up.sh up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: wifizone
      POSTGRES_USER: wifizone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifizone -d wifizone"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_PORT: "8000"
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config worker -l warning --concurrency=2
    env_file:
      - .env.production
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config beat -l warning
    env_file:
      - .env.production
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
