# WiFiZone Pro — Docker SANS Nginx/Certbot (Nginx système déjà en place)
# Usage: docker compose -f docker-compose.host-nginx.yml up -d
# App exposée uniquement sur 127.0.0.1:8004 (ports 8000-8003 libres pour vos autres apps)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wifizone}
      POSTGRES_USER: ${POSTGRES_USER:-wifizone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wifizone} -d ${POSTGRES_DB:-wifizone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CHANNEL_LAYER_URL: ${CHANNEL_LAYER_URL}
      APP_PORT: "8000"
      ASGI_SERVER: ${ASGI_SERVER:-gunicorn}
    ports:
      - "127.0.0.1:${WIFIZONE_HOST_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config worker -l warning --concurrency=2
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config beat -l warning
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
