# Nginx système — WiFiZone Pro
# Fichier: /etc/nginx/sites-available/wifi.nigercertify.com
#
# Installation:
#   sudo cp wifi.nigercertify.com.conf /etc/nginx/sites-available/wifi.nigercertify.com
#   sudo ln -sf /etc/nginx/sites-available/wifi.nigercertify.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# WiFiZone écoute sur 127.0.0.1:8004 (vos autres apps: 8000-8003)

upstream wifizone_backend {
    server 127.0.0.1:8004;
    keepalive 16;
}

# Redirection HTTP → HTTPS (si SSL déjà géré par Certbot sur ce serveur)
server {
    listen 80;
    listen [::]:80;
    server_name wifi.nigercertify.com www.wifi.nigercertify.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wifi.nigercertify.com www.wifi.nigercertify.com;

    # Certificats Let's Encrypt (adapter si chemins différents sur votre serveur)
    ssl_certificate     /etc/letsencrypt/live/wifi.nigercertify.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wifi.nigercertify.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location /accounts/login/ {
        proxy_pass http://wifizone_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

  # WebSocket dashboard live
    location /ws/ {
        proxy_pass http://wifizone_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://wifizone_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
