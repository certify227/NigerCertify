{% extends "base_app.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block app_content %}
<div class="card p-4">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'hotspots:login_template_list' %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
