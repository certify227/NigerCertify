{% extends "base.html" %}
{% block title %}Connexion — WiFiZone Pro{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="mb-4">Connexion</h3>
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}
          <div class="alert alert-danger">Identifiants incorrects.</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Utilisateur</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
        <p class="mt-3 text-center small">
          Pas de compte ? <a href="{% url 'accounts:register' %}">Créer un compte</a><br>
          <a href="{% url 'accounts:password_reset' %}">Mot de passe perdu ?</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
