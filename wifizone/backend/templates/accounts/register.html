{% extends "base.html" %}
{% block title %}Inscription — WiFiZone Pro{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="mb-2">Créer un compte</h3>
        <p class="text-muted small mb-4">Essai gratuit 14 jours — Starter</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100">Commencer l'essai gratuit</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
