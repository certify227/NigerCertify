{% extends "base.html" %}
{% block title %}Email envoyé{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card p-5 mx-auto" style="max-width: 500px;">
    <i class="bi bi-envelope-check display-4 text-primary"></i>
    <h3 class="mt-3">Vérifiez votre boîte mail</h3>
    <p class="text-muted">Si un compte existe avec cet email, un lien de réinitialisation a été envoyé.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Connexion</a>
  </div>
</div>
{% endblock %}
