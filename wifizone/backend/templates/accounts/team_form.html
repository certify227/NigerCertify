{% extends "base_app.html" %}
{% block page_title %}Ajouter un employé{% endblock %}
{% block app_content %}
<div class="card p-4">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Créer l'employé</button>
    <a href="{% url 'accounts:team_list' %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
