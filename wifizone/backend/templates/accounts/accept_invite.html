{% extends "base.html" %}
{% block title %}Acceptation invitation{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h4>Invitation équipe</h4>
        <p class="text-muted">Vous rejoignez l'équipe de <strong>{{ invite.owner.display_name }}</strong> en tant que {{ invite.get_role_display }}.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Identifiant</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Créer mon compte</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
