{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="mb-3">Mot de passe perdu</h3>
        <p class="text-muted small">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
        </form>
        <p class="mt-3 text-center small"><a href="{% url 'accounts:login' %}">Retour connexion</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
