#config-version=FG6H1F-7.2.8-FW-build1639-240320:opmode=0:vdom=0:user=admin
#conf_file_ver=123456789
#buildno=1639
#serialNumber=FG6H1FTK22000001
# FortiGate-601F

config system global
    set hostname "FG601F-LAB"
    set alias "Datacenter-Edge"
    set admintimeout 30
    set admin-sport 443
    set admin-ssh-port 22
    set multi-factor-authentication optional
    set alias "FG601F"
end

config system password-policy
    set status enable
    set minimum-length 8
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 0
    set min-number 1
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC dummy
    next
    edit "soc-oper"
        set accprofile "prof_admin"
        set vdom "root"
        set trusthost1 10.10.10.0 255.255.255.0
        set two-factor fortitoken
        set fortitoken "FTKMOB123"
    next
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https http ssh
        set type physical
        set role wan
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role lan
        set snmp-index 3
    next
end

config system ntp
    set ntpsync enable
    set type custom
end

config system dns
    set primary 1.1.1.1
    set secondary 8.8.8.8
end

config system snmp community
    edit "1"
        set name "public"
        set query-v1-status enable
        set query-v2c-status enable
    next
end

config log syslogd setting
    set status disable
end

config log fortianalyzer setting
    set status disable
end

config log disk setting
    set status enable
end

config system fortiguard
    set update-server-location usa
end

config ips sensor
    edit "default"
        set comment "default"
    next
end

config antivirus profile
    edit "default"
    next
end

config application list
    edit "default"
    next
end

config webfilter profile
    edit "default"
    next
end

config firewall ssl-ssh-profile
    edit "certificate-inspection"
    next
    edit "no-inspection"
    next
end

config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set nat enable
    next
    edit 2
        set name "ANY-ANY-LAB"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN-to-WAN-secure"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "internal-servers"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS" "NTP"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set webfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "obsolete"
        set status disable
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end

config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set port 443
    set source-interface "port1"
    set source-address "all"
end

config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "port1"
        set peertype any
        set proposal aes128-sha1
        set dhgrp 5
        set remote-gw 198.51.100.1
        set psksecret ENC dummy
    next
end

config firewall vip
    edit "pub-web"
        set extip 203.0.113.20
        set mappedip "10.0.0.50"
        set extintf "port1"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end

config system api-user
    edit "automation"
        set api-key ENC dummy
        set accprofile "super_admin"
    next
end

config system ha
    set mode standalone
end
