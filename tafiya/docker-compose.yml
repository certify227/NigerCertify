services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: tafiya-dev-secret-change-me
      DATABASE_URL: sqlite:////data/tafiya.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - tafiya_data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  tafiya_data: